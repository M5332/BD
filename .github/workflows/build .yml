name: Build and push app image

on:
  push:
    branches: [deploy]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Docker Hub image setting
        run: test -n "$IMAGE_NAME" || (echo "Set the DOCKERHUB_IMAGE Actions variable to username/repository" >&2; exit 1)

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_IMAGE }}:latest
