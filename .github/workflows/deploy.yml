name: Build and deploy app

on:
  workflow_run:
    workflows: ["Build and push app image"]
    types: [completed]
    branches: [deploy]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && 'latest' || github.event.workflow_run.head_sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate Docker Hub image setting
        run: test -n "$IMAGE_NAME" || (echo "Set the DOCKERHUB_IMAGE Actions variable to username/repository" >&2; exit 1)

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy Spring Boot app
        run: |
          helm upgrade --install app ./deploy/helm/app \
            --set-string image.repository="$IMAGE_NAME" \
            --set-string image.tag="$IMAGE_TAG"
          kubectl rollout status deployment/app --timeout=180s