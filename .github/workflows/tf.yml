name: tf 

on: 
  workflow_dispatch:

jobs:
  tf:
  runs-on : ubuntu 

  steps:

  - name: azure login
    use: azure/login@v1
    with:
      client-id: ${{secrets.AZURE_CLIENT_ID}}
      tenant-id: ${{secrets.AZURE_TENANT_ID}}
      subscription: ${{secrets.AZURE_SUBSCRIPTION_ID}}
      client-secret: ${{secrets.AZURE_CLIENT_SECRET}}
      creds: ${{secrest.AZURE_CREDENTIALS}}
      auth-type: SERVICE_PRINCIPAL
  
  - name : setup teraform 
    use: hashicorp/setup-terraform@v3

  - name: terraform Init
    use : M5332/teraform-init@v2
    with:
      path: ./tf2
  
  - name: terraform plan 
    use: M5332/ terraform-plan@v2
    with:
      path: ./tf2

  - name: terraform apply
    use: M5332/terraform-apply@v1
    with: 
      path: ./tf2

  - name: terraform destroy
    use: M5332/terraform-destroy@v1
    with :
      path: ./tf2
  