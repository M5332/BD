apiVersion: v1
kind: Service
metadata:
  name: {{ include "wedding-invitation.fullname" . }}
  labels:
    {{- include "wedding-invitation.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "wedding-invitation.selectorLabels" . | nindent 4 }}