apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wedding-invitation.fullname" . }}
  labels:
    {{- include "wedding-invitation.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wedding-invitation.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wedding-invitation.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: wedding-invitation
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi